name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap init "Blentronix Audio" "com.blentronix.audio" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Configure Clean Gradle Properties & Resolve Kotlin Conflicts
        run: |
          # Enable Jetifier and suppress duplicate Kotlin stdlib
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.jetifier.ignorelist=kotlin-stdlib-jdk7,kotlin-stdlib-jdk8" >> android/gradle.properties

          # Exclude conflicting Kotlin modules in app/build.gradle
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Align & Sign APK (Fixes Android Parsing Problem)
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          # Generate standard keystore
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          # 4-byte zipalign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" ./Blentronix-Aligned.apk

          # apksigner with v1 + v2 + v3 scheme
          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out ./Blentronix-Audio.apk ./Blentronix-Aligned.apk

          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose ./Blentronix-Audio.apk

      - name: Upload Final Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Blentronix-Audio-APK
          path: ./Blentronix-Audio.apk
