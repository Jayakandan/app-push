name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Setup Capacitor Android with Universal SDK Support
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap init "Blentronix Audio" "com.blentronix.audio" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Force Wide Android Phone Compatibility (minSdk 22, TargetSdk 34)
        run: |
          # 1. Resolve Kotlin conflicts in gradle
          echo "android.jetifier.ignorelist=kotlin-stdlib-jdk7,kotlin-stdlib-jdk8" >> android/gradle.properties
          
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # 2. Force minSdk to 22 (Supports Android 5.1 up to Android 15)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 22/g' android/variables.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 22/g' android/app/build.gradle || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Create Signed Release APK (Solves Android Parse Error)
        run: |
          # Find the compiled APK
          RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          # Generate standard debug keystore
          keytool -genkey -v -keystore release.keystore -alias blentronix -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Blentronix, OU=Audio, O=App, L=City, S=State, C=US"

          # Find Android build-tools apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Zipalign and sign with v1 + v2 + v3 schemes
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" Blentronix-Audio-Aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:password --ks-key-alias blentronix --key-pass pass:password --out Blentronix-Audio-Signed.apk Blentronix-Audio-Aligned.apk

          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose Blentronix-Audio-Signed.apk

      - name: Upload Universal Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Blentronix-Audio-Universal-APK
          path: ./Blentronix-Audio-Signed.apk
